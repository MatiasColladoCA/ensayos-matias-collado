<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=VCR+OSD+Mono&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style id="dynamic-fonts"></style>
    <script>
        (function() {
            var prefix = '/' + window.location.pathname.split('/').filter(function(p) { return p.length > 0 && p !== 'test' && p !== 'sandbox'; }).join('/');
            if (prefix === '/') prefix = '';
            var fontUrl = prefix + '/fonts/ArobaModernDemo-Regular.woff2';
            var style = document.getElementById('dynamic-fonts');
            style.textContent = '@font-face{font-family:"Aroba Modern";src:url("' + fontUrl + '") format("woff2");font-weight:normal;font-style:normal;font-display:swap;}';
            var link = document.createElement('link');
            link.rel = 'preload';
            link.href = fontUrl;
            link.as = 'font';
            link.type = 'font/woff2';
            link.crossOrigin = 'anonymous';
            document.head.appendChild(link);
            var rotUrl = prefix + '/fonts/ROTHEFIGHT.woff2';
            var rotLink = document.createElement('link');
            rotLink.rel = 'preload';
            rotLink.href = rotUrl;
            rotLink.as = 'font';
            rotLink.type = 'font/woff2';
            rotLink.crossOrigin = 'anonymous';
            document.head.appendChild(rotLink);
            style.textContent += '@font-face{font-family:"ROTHEFIGHT";src:url("' + rotUrl + '") format("woff2");font-weight:normal;font-style:normal;font-display:swap;}';
        })();
    </script>
    <style>
        :root {
            --color-primary: #98b2ea;
            --color-dim: #6e85b3;
            --color-primary-rgb: 152, 178, 234;
        }
        body, html { margin: 0; padding: 0; overflow: hidden !important; background-color: #111; }
        #three-canvas { width: 100vw; height: 100vh; display: block; }
        
        .site-title {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-45%);
            font-family: 'Aroba Modern', sans-serif;
            font-size: 22px;
            font-weight: normal;
            color: var(--color-primary);
            text-transform: uppercase;
            letter-spacing: 90px;
            white-space: nowrap;
            padding-right: 45px;
            box-sizing: border-box;
            text-shadow: 
                0 0 6px var(--color-primary),
                0 0 12px rgba(var(--color-primary-rgb), 0.8),
                0 0 24px rgba(var(--color-primary-rgb), 0.4);
            z-index: 1000;
            pointer-events: none;
            text-align: center;
        }

        .mobile-break {
            display: none;
        }
        
        /* Mobile Version */
        @media (max-width: 768px) {
            .site-title {
                top: 40px;
                font-size: 18px;
                letter-spacing: 20px;
                padding-right: 10px;
                transform: translateX(-50%);
                white-space: normal;
                width: 100%;
                line-height: 1.5;
            }

            .mobile-break {
                display: block;
            }
            
            /* Stack UI components vertically */
            .ui-instructions {
                bottom: 100px !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: 100%;
                font-size: 9px !important;
            }
            
            .ui-bottom-controls {
                bottom: 65px !important;
                right: 50% !important;
                transform: translateX(50%) !important;
                flex-direction: row;
                justify-content: center;
            }
            
            .ui-perf-stats {
                bottom: 30px !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: 100%;
                text-align: center !important;
            }
            
            /* Section titles more to the left and wider */
            .section-wrapper {
                width: 85% !important;
                left: 45% !important; /* Move a bit to the left from center */
            }

            .section-title {
                font-size: clamp(40px, 6.4vw, 76px) !important;
            }
        }
        
        .crt-phosphor {
            font-family: 'VCR OSD Mono', monospace;
            color: var(--color-primary);
            text-shadow: 
                0 0 2px var(--color-primary),
                0 0 4px var(--color-primary),
                0 0 8px rgba(var(--color-primary-rgb), 0.6),
                0 0 16px rgba(var(--color-primary-rgb), 0.3);
        }
        
        .crt-phosphor-dim {
            font-family: 'VCR OSD Mono', monospace;
            color: var(--color-dim);
            text-shadow: 
                0 0 1px var(--color-dim),
                0 0 3px rgba(90, 116, 153, 0.5);
        }
        
        .crt-scanlines {
            position: relative;
        }
        .crt-scanlines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="site-title" style="opacity:0;transition:opacity 0.5s ease;">Matías<br class="mobile-break">Collado</div>
    <canvas id="three-canvas"></canvas>
    {{ $appOptions := dict "minify" false "targetPath" "js/sandbox-3d.js" }}
    {{ $appJs := resources.Get "js/sandbox.js" | js.Build $appOptions }}
    <script type="module" src="{{ $appJs.Permalink }}"></script>
</body>
</html>
