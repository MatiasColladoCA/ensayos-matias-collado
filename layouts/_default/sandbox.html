<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden !important; background-color: #111; }
        #three-canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="three-canvas"></canvas>
    {{ $appOptions := dict "minify" false "targetPath" "js/sandbox-3d.js" }}
    {{ $appJs := resources.Get "js/sandbox.js" | js.Build $appOptions }}
    <script type="module" src="{{ $appJs.Permalink }}"></script>
</body>
</html>
