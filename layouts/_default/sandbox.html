<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="preload" href="fonts/ArobaModernDemo-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=VCR+OSD+Mono&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Aroba Modern';
            src: url('fonts/ArobaModernDemo-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        body, html { margin: 0; padding: 0; overflow: hidden !important; background-color: #111; }
        #three-canvas { width: 100vw; height: 100vh; display: block; }
        
        .site-title {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Aroba Modern', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #A0E0FF;
            text-transform: uppercase;
            letter-spacing: 90px;
            white-space: nowrap;
            text-shadow: 
                0 0 6px #A0E0FF,
                0 0 12px rgba(160, 224, 255, 0.8),
                0 0 24px rgba(160, 224, 255, 0.4);
            z-index: 1000;
            pointer-events: none;
        }
        
        .crt-phosphor {
            font-family: 'VCR OSD Mono', monospace;
            color: #A0E0FF;
            text-shadow: 
                0 0 2px #A0E0FF,
                0 0 4px #A0E0FF,
                0 0 8px rgba(160, 224, 255, 0.6),
                0 0 16px rgba(160, 224, 255, 0.3);
        }
        
        .crt-phosphor-dim {
            font-family: 'VCR OSD Mono', monospace;
            color: #70B8DD;
            text-shadow: 
                0 0 1px #70B8DD,
                0 0 3px rgba(112, 184, 221, 0.5);
        }
        
        .crt-scanlines {
            position: relative;
        }
        .crt-scanlines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="site-title">Matías Collado</div>
    <canvas id="three-canvas"></canvas>
    {{ $appOptions := dict "minify" false "targetPath" "js/sandbox-3d.js" }}
    {{ $appJs := resources.Get "js/sandbox.js" | js.Build $appOptions }}
    <script type="module" src="{{ $appJs.Permalink }}"></script>
</body>
</html>
